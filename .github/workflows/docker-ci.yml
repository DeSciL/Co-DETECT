name: Docker CI

on:
  push:
    tags: ['*']

  workflow_dispatch:

env:
  HARBOR: ${{ secrets.HARBOR_REGISTRY_URL }}
  PROJECT: led

jobs:
  build:
    runs-on: descil-runners
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: codetect
            dockerfile: Dockerfile
            description: "Co-DETECT Backend"
          - label: codetect-frontend
            dockerfile: Dockerfile_frontend
            description: "Co-DETECT Frontend"

    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Build the Docker image
        run: |
          docker build . \
            --file ${{ matrix.dockerfile }} \
            --tag local-image:${{ steps.version.outputs.tag }} \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            --provenance=false \
            --label org.opencontainers.image.source=https://github.com/DeSciL/Co-DETECT \
            --label org.opencontainers.image.description="${{ matrix.description }}" \
            --label org.opencontainers.image.licenses=Apache-2.0

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.HARBOR_REGISTRY_URL }}
          username: ${{ secrets.HARBOR_REGISTRY_USER }}
          password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}

      - name: Tag and push to Harbor (versioned)
        run: |
          docker tag local-image:${{ steps.version.outputs.tag }} $HARBOR/$PROJECT/${{ matrix.label }}:${{ steps.version.outputs.tag }}
          docker push $HARBOR/$PROJECT/${{ matrix.label }}:${{ steps.version.outputs.tag }}

      - name: Tag and push to Harbor (latest)
        run: |
          docker tag local-image:${{ steps.version.outputs.tag }} $HARBOR/$PROJECT/${{ matrix.label }}:latest
          docker push $HARBOR/$PROJECT/${{ matrix.label }}:latest

      - name: Sign Harbor image with Cosign
        run: |
          DIGEST=$(docker buildx imagetools inspect $HARBOR/$PROJECT/${{ matrix.label }}:${{ steps.version.outputs.tag }} --format '{{json .Manifest.Digest}}' | jq -r .)
          cosign sign --yes $HARBOR/$PROJECT/${{ matrix.label }}@$DIGEST
